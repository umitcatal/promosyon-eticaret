name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH into VDS and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            set -e
            cd /var/www/kurumsalpromo
            # Sunucu bir deploy hedefi: yerel commit/force-push farklarını tolere etmek için
            # fast-forward yerine origin/main'e birebir eşitle. .env ve public/uploads
            # gitignore'da olduğu için reset --hard bunlara dokunmaz.
            git fetch --prune origin main
            git reset --hard origin/main
            npm install
            npm run build
            pm2 restart kurumsalpromo
