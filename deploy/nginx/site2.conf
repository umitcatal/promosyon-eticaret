# Site 2 - tmtpromosyon.com (Cloudflare Origin CA)
# Bu sunucuda Next.js 127.0.0.1:3002 uzerinde calisiyor.
# Origin CA kullaniliyorsa sertifika dosyalari Cloudflare > SSL/TLS > Origin Server
# ekranindan uretilir. Let's Encrypt kullanilacaksa sertifika yollarini
# /etc/letsencrypt/live/tmtpromosyon.com/... olarak degistirin.
server {
    listen 80;
    listen [::]:80;
    server_name tmtpromosyon.com www.tmtpromosyon.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://tmtpromosyon.com$request_uri;
    }
}

# www -> apex canonical redirect
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.tmtpromosyon.com;

    ssl_certificate /etc/ssl/cloudflare/tmtpromosyon.pem;
    ssl_certificate_key /etc/ssl/cloudflare/tmtpromosyon.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://tmtpromosyon.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tmtpromosyon.com;

    ssl_certificate /etc/ssl/cloudflare/tmtpromosyon.pem;
    ssl_certificate_key /etc/ssl/cloudflare/tmtpromosyon.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
